name = "greek-book-scanner"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://labispe89.github.io"
AUTHORIZED_FEEDS = "[]"
SCAN_SETTINGS = '{"query":"","settings":{"buyProfit":7,"buyROI":70,"watchMin":4,"watchMax":7}}'
SCAN_HOUR_ATHENS = "08"

# Enable after creating and binding KV; default is no background work.
# [[kv_namespaces]]
# binding = "SCANS"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Hourly UTC trigger; SCAN_HOUR_ATHENS gates execution to 08:00 local time,
# including daylight saving changes.
# [triggers]
# crons = ["0 * * * *"]
